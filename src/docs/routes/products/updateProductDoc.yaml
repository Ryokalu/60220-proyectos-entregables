paths:
  /api/products/{pid}:
    put:
      summary: update the product using the given pid (only works for admin and premium users)
      tags:
        - Products
      parameters:
        - name: pid
          in: path
          description: need to use the product id (you need to use the id inside in ObjectId))
          required: true
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/requestBodies/createProduct" #agregar la ruta de referencia
      responses:
        "200":
          description: "the ok given by the app"
          content:
            application/json:
              schema:
                type: string
                description: "the result given by the app"
                example: producto modificado correctamente
        "400":
          description: "empty fields"
        "401":
          description: "cannot find the given pid or you need to be authorized"
        "500":
          description: "The server cannot respond to the request. "
