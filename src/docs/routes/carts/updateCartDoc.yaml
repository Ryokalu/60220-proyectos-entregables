paths:
  /api/products/{cid}/products/{pid}:
    put:
      summary: update the quantity of the product in the cart
      tags:
        - Carts
      parameters:
        - name: cid
          in: path
          description: the cart id assign to the user
          required: true
          type: string
        - name: pid
          in: path
          description: the product's id
          required: true
          type: string
      responses:
        "200":
          description: the update result given by the app
          content:
            application/json:
              schema:
                type: string
                example: Cantidad actualizada
        "401":
          description: cannot find the pid o cid or you are not authorized"
        "500":
          description: the app cannot process the request due to a bad query
